name: AI Security Benchmark CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-benchmark:
    runs-on: ubuntu-latest
    env:
      # Credentials come strictly from GitHub Actions Secrets, never config files.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ASB_NON_INTERACTIVE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Arbiter SecurityBench
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate benchmark dataset
        run: arbiter dataset validate --json

      - name: Run AI security benchmark with security gates
        # Optional: pass `--baseline-file baselines/main_report.json` when comparing against main.
        run: |
          arbiter --non-interactive benchmark run \
            --config examples/securitybench.ci.yaml \
            --report-format json,html \
            --export-report \
            --json > benchmark_ci_output.json

      - name: Print CI gate failure summary
        if: failure()
        run: |
          if [ -f benchmark_ci_output.json ]; then
            python -c "import collections, glob, json; d=json.load(open('benchmark_ci_output.json')); reports=sorted(glob.glob('reports/*.json')); rep=json.load(open(reports[-1])) if reports else {}; errs=rep.get('failed_and_inconclusive_tests',{}).get('execution_errors',[]); counts=dict(collections.Counter(e.get('error_message') for e in errs)); print(json.dumps({'run_status': d.get('run',{}).get('status'), 'completed_tests': d.get('run',{}).get('completed_tests'), 'failed_tests': d.get('run',{}).get('failed_tests'), 'error_details': d.get('run',{}).get('error_details'), 'unique_execution_error_counts': counts, 'sample_execution_errors': errs[:3], 'gate_evaluation': d.get('gate_evaluation')}, indent=2))"
          fi

      - name: Upload JSON and HTML report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-securitybench-reports
          path: |
            reports/*.json
            reports/*.html
            benchmark_ci_output.json
          if-no-files-found: warn
